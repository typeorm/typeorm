name: Tests
on:
  push:
    branches:
      - master
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.detect-changes.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: detect-changes
        with:
          filters: |
            package-json: &package-json
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml

            ci: &ci
              - .github/**/*
              - .pr_agent.toml
              - pr_compliance_checklist.yaml

            docs: &docs
              - docs/**/*

            src: &src
              - *package-json
              - packages/typeorm/package.json
              - packages/typeorm/extra/**/*.js
              - packages/typeorm/src/**/*.ts
              - packages/typeorm/gulpfile.ts
              - packages/typeorm/tsconfig.json
              - packages/typeorm/tsconfig.browser.json
              - packages/typeorm/tsconfig.node.json

            src-or-tests: &src-or-tests
              - *src
              - .github/actions/setup-node/**
              - .github/actions/upload-coverage/**
              - .github/workflows/test*.yml
              - docker-compose.yml
              - docker/**/*
              - packages/typeorm/test/**/*
              - packages/typeorm/.c8rc.json
              - packages/typeorm/.mocharc.json
              - packages/typeorm/ormconfig.sample.json

            lint:
              - *src-or-tests
              - packages/**/eslint.config.mjs
              - packages/codemod/**/*

            codemod:
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - packages/codemod/**/*

            legacy-naming-strategies:
              - *src
              - packages/legacy-naming-strategies/**/*

  docs:
    if: contains(needs.detect-changes.outputs.changes, 'docs')
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-docs

  build:
    if: contains(needs.detect-changes.outputs.changes, 'src-or-tests')
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: pnpm run compile

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          path: packages/typeorm/build/
          retention-days: 1

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: pnpm run format:ci

  lint:
    if: contains(needs.detect-changes.outputs.changes, 'lint')
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      # `@typeorm/legacy-naming-strategies` is type-checked against `typeorm`,
      # which resolves to ./build/package via publishConfig.directory, so the
      # core package has to exist before it can be linted.
      - run: pnpm run package
      - run: pnpm run lint
      - run: pnpm run check:manifests

  tests-linux:
    if: contains(needs.detect-changes.outputs.changes, 'src-or-tests')
    needs: [detect-changes, build]
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    uses: ./.github/workflows/tests-linux.yml
    with:
      node-version: ${{matrix.node-version}}

  tests-windows:
    if: contains(needs.detect-changes.outputs.changes, 'src-or-tests')
    needs: [detect-changes, build]
    uses: ./.github/workflows/tests-windows.yml
    with:
      node-version: 22

  tests-codemod:
    if: contains(needs.detect-changes.outputs.changes, 'codemod')
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SonarQube needs full history for blame and PR diffing against master
      - uses: ./.github/actions/setup-node
      - run: pnpm exec c8 pnpm test
        working-directory: packages/codemod
      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          projectBaseDir: packages/codemod
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  tests-legacy-naming-strategies:
    if: contains(needs.detect-changes.outputs.changes, 'legacy-naming-strategies')
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SonarQube needs full history for blame and PR diffing against master
      - uses: ./.github/actions/setup-node
      # `typeorm` resolves to ./build/package via publishConfig.directory,
      # so the core package has to exist before these tests can run.
      - run: pnpm run package
      - run: pnpm exec c8 pnpm test
        working-directory: packages/legacy-naming-strategies
      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          projectBaseDir: packages/legacy-naming-strategies
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  coverage:
    if: contains(needs.detect-changes.outputs.changes, 'src-or-tests')
    runs-on: ubuntu-latest
    needs: [detect-changes, tests-linux, tests-windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SonarQube needs full history for blame and PR diffing against master
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: packages/typeorm/coverage/

      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          projectBaseDir: packages/typeorm
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  all-passed:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build
      - coverage
      - detect-changes
      - docs
      - format
      - lint
      - tests-codemod
      - tests-legacy-naming-strategies
      - tests-linux
      - tests-windows
    steps:
      - run: exit ${{ contains(needs.*.result, 'failure') && 1 || 0 }}
