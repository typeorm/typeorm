name: Publish Package to npmjs
on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # pnpm handles Trusted Publishing (OIDC) and provenance natively, so
      # neither npm nor an .npmrc with a registry token is needed.
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@20
          cache: true
          require-lockfile: true
      - run: pnpm run package
      - run: |
          cd build/package
          pnpm publish --provenance --access public --no-git-checks --ignore-scripts --tag legacy
