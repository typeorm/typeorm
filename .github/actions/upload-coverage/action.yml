name: Upload coverage
description: Upload c8 coverage report as an artifact

inputs:
  name:
    description: Artifact name for this coverage report
    required: true

runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-${{ inputs.name }}
        path: packages/typeorm/coverage/lcov.info
        retention-days: 1
        if-no-files-found: error
