name: Setup Node.js with pnpm
description: Sets up pnpm, Node.js with caching, and installs dependencies

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "26"
  working-directory:
    description: Working directory
    required: false
  download-build:
    description: Download build artifact
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Installs pnpm (version from `packageManager`), Node.js, restores the
    # store cache and runs `pnpm install --frozen-lockfile`.
    - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        runtime: node@${{ inputs.node-version }}
        cache: true
        require-lockfile: true
        working-directory: ${{ inputs.working-directory || '.' }}

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      if: inputs.download-build == 'true'
      with:
        name: build
        path: packages/typeorm/build/
